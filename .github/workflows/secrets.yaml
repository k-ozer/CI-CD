name: CoderCo Secrets CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: use secrets
      run: echo "The secret value is ${{ secrets.MY_SECRET }}"

    - name: use secrets as env var
      run: echo "The secret is $MY_SECRET"
      env:
        MY_SECRET: ${{ secrets.MY_SECRET }}